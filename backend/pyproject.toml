[project]
name = "catdog-api"
version = "0.1.0"
description = "API классификатора кошка/собака + раздача фронтенда"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "pillow>=12.0,<13",
    "numpy>=2.1,<3",
    "torch==2.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
